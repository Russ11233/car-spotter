<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Car Wiki — CarSpotter</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link
    href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Bebas+Neue&display=swap"
    rel="stylesheet"
  />

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:           #f4f1eb;
      --surface:      #ffffff;
      --border:       #ddd9d0;
      --text:         #1c1b18;
      --muted:        #7a7870;
      --accent:       #c0392b;
      --radius:       8px;
      --font-body:    'DM Sans', sans-serif;
      --font-display: 'Bebas Neue', sans-serif;
    }

    body {
      font-family: var(--font-body);
      background: var(--bg);
      color: var(--text);
      font-size: 16px;
      line-height: 1.6;
    }

    a { color: inherit; text-decoration: none; }
    a:hover { text-decoration: underline; }

    /* ── Header ─────────────────────────────────────────────── */
    header {
      background: var(--text);
      color: #fff;
      padding: 0 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: 56px;
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .logo {
      font-family: var(--font-display);
      font-size: 26px;
      letter-spacing: 0.04em;
      color: #fff;
    }

    .logo span { color: var(--accent); }

    nav { display: flex; gap: 24px; }

    nav a {
      font-size: 14px;
      font-weight: 500;
      color: rgba(255,255,255,0.7);
      transition: color 0.15s;
    }

    nav a:hover, nav a.active { color: #fff; text-decoration: none; }

    /* ── Page header ─────────────────────────────────────────── */
    .page-header {
      background: var(--text);
      color: #fff;
      padding: 40px 24px 44px;
      border-bottom: 3px solid var(--accent);
    }

    .page-header h1 {
      font-family: var(--font-display);
      font-size: clamp(36px, 6vw, 64px);
      letter-spacing: 0.04em;
      line-height: 1;
      margin-bottom: 8px;
    }

    .page-header p {
      font-size: 15px;
      color: rgba(255,255,255,0.6);
    }

    /* ── Layout ──────────────────────────────────────────────── */
    .layout {
      max-width: 1040px;
      margin: 0 auto;
      padding: 40px 24px 80px;
      display: grid;
      grid-template-columns: 200px 1fr;
      gap: 40px;
      align-items: start;
    }

    /* ── Sidebar filters ─────────────────────────────────────── */
    .sidebar {
      position: sticky;
      top: 76px;
    }

    .filter-group {
      margin-bottom: 28px;
    }

    .filter-label {
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 8px;
      display: block;
    }

    .filter-btn {
      display: block;
      width: 100%;
      text-align: left;
      padding: 6px 10px;
      font-family: var(--font-body);
      font-size: 14px;
      background: none;
      border: none;
      border-radius: var(--radius);
      cursor: pointer;
      color: var(--text);
      transition: background 0.12s;
      margin-bottom: 2px;
    }

    .filter-btn:hover   { background: var(--border); }
    .filter-btn.active  { background: var(--text); color: #fff; font-weight: 600; }

    .filter-count {
      float: right;
      font-size: 12px;
      color: var(--muted);
      font-weight: 400;
    }

    .filter-btn.active .filter-count { color: rgba(255,255,255,0.6); }

    /* ── Search ──────────────────────────────────────────────── */
    .search-wrap {
      margin-bottom: 20px;
    }

    .search-wrap input {
      width: 100%;
      font-family: var(--font-body);
      font-size: 15px;
      padding: 10px 14px;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      background: var(--surface);
      color: var(--text);
    }

    .search-wrap input:focus {
      outline: none;
      border-color: var(--text);
    }

    /* ── Results meta ────────────────────────────────────────── */
    .results-meta {
      font-size: 13px;
      color: var(--muted);
      margin-bottom: 16px;
    }

    /* ── Car grid ────────────────────────────────────────────── */
    .car-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 14px;
    }

    .car-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
      display: block;
      transition: box-shadow 0.15s, border-color 0.15s;
    }

    .car-card:hover {
      border-color: #bbb;
      box-shadow: 0 4px 16px rgba(0,0,0,0.08);
      text-decoration: none;
    }

    .car-card-img {
      width: 100%;
      aspect-ratio: 16/9;
      background: var(--bg);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 32px;
      color: var(--border);
      border-bottom: 1px solid var(--border);
      overflow: hidden;
    }

    .car-card-img img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .car-card-body { padding: 14px; }

    .car-card-era {
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--accent);
      margin-bottom: 4px;
    }

    .car-card-name {
      font-size: 15px;
      font-weight: 700;
      margin-bottom: 4px;
      line-height: 1.3;
    }

    .car-card-desc {
      font-size: 12px;
      color: var(--muted);
      line-height: 1.4;
    }

    .car-card-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 4px;
      margin-top: 10px;
    }

    .tag {
      font-size: 11px;
      padding: 2px 7px;
      border-radius: 20px;
      background: var(--bg);
      border: 1px solid var(--border);
      color: var(--muted);
    }

    /* ── Empty state ─────────────────────────────────────────── */
    .empty {
      grid-column: 1 / -1;
      text-align: center;
      padding: 60px 20px;
      color: var(--muted);
      font-size: 15px;
    }

    /* ── Footer ──────────────────────────────────────────────── */
    footer {
      background: var(--text);
      color: rgba(255,255,255,0.45);
      text-align: center;
      padding: 24px;
      font-size: 13px;
    }

    /* ── Responsive ──────────────────────────────────────────── */
    @media (max-width: 700px) {
      .layout {
        grid-template-columns: 1fr;
        gap: 24px;
      }

      .sidebar { position: static; }

      .filter-group { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
      .filter-label { width: 100%; margin-bottom: 0; }
      .filter-btn   { width: auto; display: inline-block; border: 1px solid var(--border); }

      nav { gap: 14px; }
      nav a { font-size: 13px; }
    }
  </style>
</head>
<body>

  <!-- ── Header ──────────────────────────────────────────────── -->
  <header>
    <a href="../index.html" class="logo">Car<span>Spotter</span></a>
    <nav>
      <a href="../index.html">Home</a>
      <a href="../identify.html">Identify</a>
      <a href="index.html" class="active">Wiki</a>
      <a href="../guides/index.html">Guides</a>
      <a href="../log.html">My Sightings</a>
    </nav>
  </header>

  <!-- ── Page header ─────────────────────────────────────────── -->
  <div class="page-header">
    <h1>Car Wiki</h1>
    <p>History, specs, and spotting tips for every vehicle in the database.</p>
  </div>

  <!-- ── Layout ──────────────────────────────────────────────── -->
  <div class="layout">

    <!-- Sidebar -->
    <aside class="sidebar">
      <div class="filter-group">
        <span class="filter-label">Era</span>
        <button class="filter-btn active" data-filter="era" data-value="all"
          onclick="setFilter('era','all',this)">
          All <span class="filter-count" id="count-era-all"></span>
        </button>
        <button class="filter-btn" data-filter="era" data-value="1950s"
          onclick="setFilter('era','1950s',this)">
          1950s <span class="filter-count" id="count-era-1950s"></span>
        </button>
        <button class="filter-btn" data-filter="era" data-value="1960s"
          onclick="setFilter('era','1960s',this)">
          1960s <span class="filter-count" id="count-era-1960s"></span>
        </button>
        <button class="filter-btn" data-filter="era" data-value="1970s"
          onclick="setFilter('era','1970s',this)">
          1970s <span class="filter-count" id="count-era-1970s"></span>
        </button>
        <button class="filter-btn" data-filter="era" data-value="1980s"
          onclick="setFilter('era','1980s',this)">
          1980s <span class="filter-count" id="count-era-1980s"></span>
        </button>
        <button class="filter-btn" data-filter="era" data-value="1990s"
          onclick="setFilter('era','1990s',this)">
          1990s <span class="filter-count" id="count-era-1990s"></span>
        </button>
      </div>

      <div class="filter-group">
        <span class="filter-label">Origin</span>
        <button class="filter-btn active" data-filter="origin" data-value="all"
          onclick="setFilter('origin','all',this)">
          All
        </button>
        <button class="filter-btn" data-filter="origin" data-value="American"
          onclick="setFilter('origin','American',this)">American</button>
        <button class="filter-btn" data-filter="origin" data-value="European"
          onclick="setFilter('origin','European',this)">European</button>
        <button class="filter-btn" data-filter="origin" data-value="Japanese"
          onclick="setFilter('origin','Japanese',this)">Japanese</button>
        <button class="filter-btn" data-filter="origin" data-value="British"
          onclick="setFilter('origin','British',this)">British</button>
      </div>

      <div class="filter-group">
        <span class="filter-label">Body</span>
        <button class="filter-btn active" data-filter="body" data-value="all"
          onclick="setFilter('body','all',this)">All</button>
        <button class="filter-btn" data-filter="body" data-value="Muscle car"
          onclick="setFilter('body','Muscle car',this)">Muscle car</button>
        <button class="filter-btn" data-filter="body" data-value="Sports car"
          onclick="setFilter('body','Sports car',this)">Sports car</button>
        <button class="filter-btn" data-filter="body" data-value="Coupe"
          onclick="setFilter('body','Coupe',this)">Coupe</button>
        <button class="filter-btn" data-filter="body" data-value="Sedan"
          onclick="setFilter('body','Sedan',this)">Sedan</button>
        <button class="filter-btn" data-filter="body" data-value="Convertible"
          onclick="setFilter('body','Convertible',this)">Convertible</button>
        <button class="filter-btn" data-filter="body" data-value="Station wagon"
          onclick="setFilter('body','Station wagon',this)">Station wagon</button>
        <button class="filter-btn" data-filter="body" data-value="Pickup truck"
          onclick="setFilter('body','Pickup truck',this)">Pickup truck</button>
        <button class="filter-btn" data-filter="body" data-value="SUV"
          onclick="setFilter('body','SUV',this)">SUV</button>
      </div>
    </aside>

    <!-- Main content -->
    <div>
      <div class="search-wrap">
        <input
          type="text"
          id="search"
          placeholder="Search by name, make, or feature..."
          oninput="render()"
        />
      </div>

      <div class="results-meta" id="results-meta"></div>

      <div class="car-grid" id="car-grid"></div>
    </div>

  </div>

  <footer>
    <p>CarSpotter &mdash; a field guide for people who look twice</p>
  </footer>

  <!-- Vehicle data — path goes up one level since we're inside /wiki/ -->
  <script src="../vehicles.js"></script>

  <script>
    // ── Filter state ────────────────────────────────────────────
    const filters = { era: 'all', origin: 'all', body: 'all' };

    function setFilter(type, value, btn) {
      filters[type] = value;
      // Update active button in this group
      document.querySelectorAll(`[data-filter="${type}"]`).forEach(b =>
        b.classList.remove('active')
      );
      btn.classList.add('active');
      render();
    }

    // ── Render ──────────────────────────────────────────────────
    function render() {
      const query = document.getElementById('search').value.toLowerCase();

      const filtered = VEHICLES.filter(v => {
        if (filters.era    !== 'all' && v.decade !== filters.era)    return false;
        if (filters.origin !== 'all' && v.origin !== filters.origin) return false;
        if (filters.body   !== 'all' && v.body   !== filters.body)   return false;
        if (query) {
          const haystack = (v.name + v.desc + v.features.join(' ')).toLowerCase();
          if (!haystack.includes(query)) return false;
        }
        return true;
      });

      // Update count badges on era buttons
      ['1950s','1960s','1970s','1980s','1990s'].forEach(era => {
        const el = document.getElementById('count-era-' + era);
        if (el) el.textContent = VEHICLES.filter(v => v.decade === era).length;
      });
      const allEl = document.getElementById('count-era-all');
      if (allEl) allEl.textContent = VEHICLES.length;

      // Results meta
      document.getElementById('results-meta').textContent =
        filtered.length === VEHICLES.length
          ? `${VEHICLES.length} vehicles`
          : `${filtered.length} of ${VEHICLES.length} vehicles`;

      // Cards
      const grid = document.getElementById('car-grid');

      if (!filtered.length) {
        grid.innerHTML = '<div class="empty">No vehicles match — try clearing a filter.</div>';
        return;
      }

      grid.innerHTML = filtered.map(v => {
        // Build a slug for the wiki page link e.g. "mustang-1965"
        const slug = v.name
          .toLowerCase()
          .replace(/[^a-z0-9]+/g, '-')
          .replace(/^-|-$/g, '');

        const tags = v.features.slice(0, 3).map(f =>
          `<span class="tag">${f}</span>`
        ).join('');

        return `
          <a href="${slug}.html" class="car-card">
            <div class="car-card-img">&#9632;</div>
            <div class="car-card-body">
              <div class="car-card-era">${v.decade} &middot; ${v.origin}</div>
              <div class="car-card-name">${v.name}</div>
              <div class="car-card-desc">${v.desc}</div>
              <div class="car-card-tags">${tags}</div>
            </div>
          </a>`;
      }).join('');
    }

    // Initial render
    render();
  </script>

</body>
</html>
