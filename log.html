<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My Sightings — CarSpotter</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Bebas+Neue&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="shared.css" />
  <style>
    .two-col {
      display: grid;
      grid-template-columns: 380px 1fr;
      gap: 40px;
      align-items: start;
    }

    /* Log form */
    .log-form {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 24px;
      position: sticky;
      top: 76px;
    }

    .log-form h2 {
      font-family: var(--font-display);
      font-size: 28px;
      letter-spacing: 0.03em;
      margin-bottom: 20px;
    }

    /* Stats */
    .stats {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      margin-bottom: 24px;
    }

    .stat {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 14px;
      text-align: center;
    }

    .stat-num   { font-size: 26px; font-weight: 700; letter-spacing: -0.03em; }
    .stat-label { font-size: 11px; color: var(--muted); margin-top: 2px; }

    /* Sighting rows */
    .sighting-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 16px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      margin-bottom: 8px;
    }

    .sighting-name { font-size: 14px; font-weight: 600; }
    .sighting-meta { font-size: 12px; color: var(--muted); margin-top: 2px; }
    .sighting-count { font-size: 22px; font-weight: 700; color: var(--muted); min-width: 28px; text-align: right; }

    .list-label {
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 12px;
    }

    @media (max-width: 720px) {
      .two-col { grid-template-columns: 1fr; }
      .log-form { position: static; }
    }
  </style>
</head>
<body>

  <header>
    <a href="index.html" class="logo">Car<span>Spotter</span></a>
    <nav>
      <a href="index.html">Home</a>
      <a href="identify.html">Identify</a>
      <a href="wiki/index.html">Wiki</a>
      <a href="guides/index.html">Guides</a>
      <a href="log.html" class="active">My Sightings</a>
    </nav>
  </header>

  <div class="page-header">
    <h1>My Sightings</h1>
    <p>Log every interesting car you spot. Build your life list over time.</p>
  </div>

  <main>
    <div class="two-col">

      <!-- Log form -->
      <div class="log-form">
        <h2>Log a sighting</h2>
        <div class="field">
          <label>Vehicle</label>
          <input type="text" id="log-vehicle" placeholder="e.g. 1967 Ford Mustang Fastback" />
        </div>
        <div class="field">
          <label>Location</label>
          <input type="text" id="log-location" placeholder="City, State" />
        </div>
        <div class="field">
          <label>Date</label>
          <input type="date" id="log-date" />
        </div>
        <div class="field">
          <label>Notes</label>
          <input type="text" id="log-notes" placeholder="Color, condition, any details..." />
        </div>
        <button class="btn btn-primary" onclick="logSighting()">Log it</button>
      </div>

      <!-- Life list -->
      <div>
        <div class="stats">
          <div class="stat">
            <div class="stat-num" id="stat-total">0</div>
            <div class="stat-label">Sightings</div>
          </div>
          <div class="stat">
            <div class="stat-num" id="stat-unique">0</div>
            <div class="stat-label">Unique</div>
          </div>
          <div class="stat">
            <div class="stat-num" id="stat-places">0</div>
            <div class="stat-label">Locations</div>
          </div>
        </div>

        <div class="list-label">Life list</div>
        <div id="life-list"></div>
      </div>

    </div>
  </main>

  <footer><p>CarSpotter &mdash; a field guide for people who look twice</p></footer>
  <div id="toast"></div>

  <script>
    let sightings = JSON.parse(localStorage.getItem('cs_sightings') || '[]');

    function save() { localStorage.setItem('cs_sightings', JSON.stringify(sightings)); }
    function today() { return new Date().toISOString().split('T')[0]; }

    function getVal(id) { return document.getElementById(id).value.trim(); }

    function logSighting() {
      const vehicle = getVal('log-vehicle');
      if (!vehicle) { alert('Enter a vehicle name.'); return; }
      sightings.push({
        vehicle,
        location: getVal('log-location'),
        date:     getVal('log-date') || today(),
        notes:    getVal('log-notes'),
        ts:       Date.now()
      });
      save();
      ['log-vehicle','log-location','log-notes'].forEach(id =>
        document.getElementById(id).value = ''
      );
      document.getElementById('log-date').value = today();
      showToast(`"${vehicle}" logged!`);
      render();
    }

    function showToast(msg) {
      const t = document.getElementById('toast');
      t.textContent = msg;
      t.classList.add('show');
      setTimeout(() => t.classList.remove('show'), 2500);
    }

    function render() {
      const counts = {};
      sightings.forEach(s => {
        if (!counts[s.vehicle]) counts[s.vehicle] = [];
        counts[s.vehicle].push(s);
      });

      const entries = Object.entries(counts).sort((a, b) => b[1].length - a[1].length);
      const locs    = new Set(sightings.map(s => s.location).filter(Boolean)).size;

      document.getElementById('stat-total').textContent  = sightings.length;
      document.getElementById('stat-unique').textContent = entries.length;
      document.getElementById('stat-places').textContent = locs;

      const el = document.getElementById('life-list');
      if (!entries.length) {
        el.innerHTML = '<p class="empty">No sightings yet. Log one above!</p>';
        return;
      }

      el.innerHTML = entries.map(([name, spots]) => {
        const last = [...spots].sort((a, b) => b.ts - a.ts)[0];
        const meta = [last.date, last.location].filter(Boolean).join(' · ');
        return `
          <div class="sighting-row">
            <div>
              <div class="sighting-name">${name}</div>
              <div class="sighting-meta">${meta}</div>
            </div>
            <div class="sighting-count">${spots.length}</div>
          </div>`;
      }).join('');
    }

    document.getElementById('log-date').value = today();

    // Handle prefill from wiki page "Log a sighting" button
    const prefill = localStorage.getItem('cs_prefill');
    if (prefill) {
      try {
        const data = JSON.parse(prefill);
        if (data.vehicle) document.getElementById('log-vehicle').value = data.vehicle;
        if (data.date)    document.getElementById('log-date').value    = data.date;
      } catch(e) {}
      localStorage.removeItem('cs_prefill');
    }

    render();
  </script>
</body>
</html>
